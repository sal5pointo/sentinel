# Risk policy — Phase 0 skeleton (enforced starting Phase 2 money path)

cash_floor_pct: 5
portfolio_heat_max_pct: 6
max_positions: 8                 # stricter than v1 until pilot proves out
max_new_per_week: 5
sector_cap_pct: 30
adv_cap_pct: 1
use_margin_borrowing: false

breakers:
  daily_loss_pct: 3
  dd_half_size_pct: 7
  dd_reduce_only_pct: 12
  dd_halt_pct: 20

buckets:
  A:
    risk_pct: 1.0
    stop_atr: 2.0
    stop_max_pct: 8
    trail_atr: 3.0
    time_stop_days: 20
    max_pos_pct: 15
  B:
    enabled: false
    risk_pct: 1.0
    trail_atr: 2.5
    time_stop_days: 40
    max_pos_pct: 15
  D:
    risk_pct: 0.75
    stop_atr: 2.5
    stop_max_pct: 12
    trail_atr: 3.0
    time_stop_days: 60
    max_pos_pct: 10
  G:
    risk_pct: 0.5
    stop: low52_minus_0.5atr
    time_stop_days: 30
    max_pos_pct: 5
  # C, E, F omitted until explicitly re-enabled

pilot:
  risk_pct: 0.5
  max_pos_pct: 3
  max_positions: 3
  buckets_allowed: [A, D, G]

restricted_list: []
other_accounts_for_wash_sale: []
core_holdings: []
